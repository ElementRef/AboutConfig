name: Deploy Some Config to GitHub Repository...

on:
  workflow_dispatch:

  schedule:
    - cron: '00 21 * * *'

jobs:
  build-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/Krypton'
          check-latest: true

      - name: Setup ESBuild
        run: |
          npm install esbuild@latest --global
          esbuild --version

      - name: Setup WARP Network
        uses: fscarmen/warp-on-actions@v1.4

      - name: Prepare Resources
        run: |
          mkdir -p ./temp
          curl -A "Surge iOS/3367" -o ./temp/Block_HTTPDNS.txt https://kelee.one/Tool/Loon/Lpx/Block_HTTPDNS.lpx
          curl -A "Surge iOS/3367" -o ./temp/BlockAdvertisers.txt https://kelee.one/Tool/Loon/Lpx/BlockAdvertisers.lpx
          curl -A "Surge iOS/3367" -o ./temp/Prevent_DNS_Leaks.txt https://kelee.one/Tool/Loon/Lpx/Prevent_DNS_Leaks.lpx
          curl -A "Surge iOS/3367" -o ./temp/Remove_Ads_By_Kelee.txt https://kelee.one/Tool/Loon/Lpx/Remove_ads_by_keli.lpx
          ls -la ./temp
          cat ./temp/Block_HTTPDNS.txt

      - name: Build with Node
        run: |
          node conf/generate.anti.ai.robots.mjs
          node conf/generate.blackmatrix7.mjs
          node conf/generate.blocklist.mjs
          node conf/generate.esbuild.mjs
          node conf/generate.filter.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--use-system-ca'

      - name: Deploy to GitHub Repository
        run: |
          git config --global user.email ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          git config --global user.name ${{ github.actor }}
          git config diff.nocase.textconv "tr '[:upper:]' '[:lower:]'"
          git status
          git add --all

          if git diff --cached --quiet; then
            echo "No Changes To Commit."
            exit 0
          fi

          git commit -m '更新分流重写'
          git pull --rebase --autostash
          git push
