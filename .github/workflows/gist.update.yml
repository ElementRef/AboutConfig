name: Deploy Some Config to GitHub Gists...

on:
  workflow_dispatch:

  # schedule:
  #   - cron: '00 00 * * *'

jobs:
  build-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: true
          fetch-depth: 1

      # https://raw.githubusercontent.com/lonecale/Rules/main/.github/workflows/Build.yml
      - name: Setup Custom TLS Flags for Curl
        run: |
          CIPHERS="ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
          TLS13_CIPHERS="TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384"
          CURVES="X25519:P-256:P-384"
          echo "TLS_FLAGS=--ciphers $CIPHERS --tls13-ciphers $TLS13_CIPHERS --curves $CURVES --compressed" >> $GITHUB_ENV

      - name: Prepare Resources
        run: |
          mkdir -p ./resources
          curl -f -sS -L -A "Loon/991 CFNetwork/3896.100.1.1.1 Darwin/27.0.0" $TLS_FLAGS -H "Accept-Language: en-us" -o ./resources/Block_HTTPDNS.lpx https://kelee.one/Tool/Loon/Lpx/Block_HTTPDNS.lpx || echo "Skipped: Block_HTTPDNS.lpx"
          curl -f -sS -L -A "Loon/991 CFNetwork/3896.100.1.1.1 Darwin/27.0.0" $TLS_FLAGS -H "Accept-Language: en-us" -o ./resources/BlockAdvertisers.lpx https://kelee.one/Tool/Loon/Lpx/BlockAdvertisers.lpx || echo "Skipped: BlockAdvertisers.lpx"
          curl -f -sS -L -A "Loon/991 CFNetwork/3896.100.1.1.1 Darwin/27.0.0" $TLS_FLAGS -H "Accept-Language: en-us" -o ./resources/Prevent_DNS_Leaks.lpx https://kelee.one/Tool/Loon/Lpx/Prevent_DNS_Leaks.lpx || echo "Skipped: Prevent_DNS_Leaks.lpx"
          curl -f -sS -L -A "Loon/991 CFNetwork/3896.100.1.1.1 Darwin/27.0.0" $TLS_FLAGS -H "Accept-Language: en-us" -o ./resources/Remove_Ads_By_Kelee.lpx https://kelee.one/Tool/Loon/Lpx/Remove_ads_by_keli.lpx || echo "Skipped: Remove_Ads_By_Kelee.lpx"
          ls -la ./resources

      - name: Update to GitHub Gists
        env:
          GH_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --rawfile a ./resources/Block_HTTPDNS.lpx \
            --rawfile b ./resources/BlockAdvertisers.lpx \
            --rawfile c ./resources/Prevent_DNS_Leaks.lpx \
            --rawfile d ./resources/Remove_Ads_By_Kelee.lpx \
            '{
              files: {
                "Block_HTTPDNS.lpx": {content: $a},
                "BlockAdvertisers.lpx": {content: $b},
                "Prevent_DNS_Leaks.lpx": {content: $c},
                "Remove_Ads_By_Kelee.lpx": {content: $d}
              }
            }')

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            "https://api.github.com/gists/${GIST_ID}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            -d "$payload"

          echo "资源更新成功"
